server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18086}

spring:
  application:
    name: compileflow-payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:h2:mem:payment_lab;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${PAYMENT_DB_USERNAME:sa}
    password: ${PAYMENT_DB_PASSWORD:}

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  payment-topic: ${ROCKETMQ_PAYMENT_TOPIC:shopping-payment-requests}

payment:
  database:
    enabled: ${PAYMENT_DATABASE_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${INSTANCE_ID:${spring.application.name}:${server.port}}
    hostname: ${INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
