input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["compileflow-logs"]
    group_id => "compileflow-logstash"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    codec => json
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "compileflow-logs-%{+yyyy.MM.dd}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
