apiVersion: v1
kind: ServiceAccount
metadata:
  name: skywalking-oap
  namespace: compileflow-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compileflow-lab-skywalking-oap
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "endpoints", "services", "nodes", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compileflow-lab-skywalking-oap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compileflow-lab-skywalking-oap
subjects:
  - kind: ServiceAccount
    name: skywalking-oap
    namespace: compileflow-lab
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-oap
  namespace: compileflow-lab
spec:
  selector:
    app: skywalking-oap
  ports:
    - name: grpc
      port: 11800
      targetPort: 11800
    - name: http
      port: 12800
      targetPort: 12800
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-oap-external
  namespace: compileflow-lab
spec:
  type: NodePort
  selector:
    app: skywalking-oap
  ports:
    - name: http
      port: 12800
      targetPort: 12800
      nodePort: 30800
    - name: grpc
      port: 11800
      targetPort: 11800
      nodePort: 30801
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-oap
  namespace: compileflow-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skywalking-oap
  template:
    metadata:
      labels:
        app: skywalking-oap
    spec:
      serviceAccountName: skywalking-oap
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: skywalking-oap
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.37.0
          command: ["sh", "-c", "until wget -qO- http://elasticsearch:9200/_cluster/health >/dev/null; do sleep 3; done"]
      containers:
        - name: oap
          image: apache/skywalking-oap-server:10.4.0-java17
          imagePullPolicy: IfNotPresent
          env:
            - name: SW_CLUSTER
              value: kubernetes
            - name: SW_CLUSTER_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SW_CLUSTER_K8S_LABEL
              value: app=skywalking-oap
            - name: SKYWALKING_COLLECTOR_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SW_STORAGE
              value: elasticsearch
            - name: SW_STORAGE_ES_CLUSTER_NODES
              value: elasticsearch:9200
            - name: JAVA_OPTS
              value: -Xms384m -Xmx768m
          ports:
            - name: grpc
              containerPort: 11800
            - name: http
              containerPort: 12800
          startupProbe:
            tcpSocket:
              port: 12800
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 12800
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: skywalking-oap
  namespace: compileflow-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: skywalking-oap
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-ui
  namespace: compileflow-lab
spec:
  type: NodePort
  selector:
    app: skywalking-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-ui
  namespace: compileflow-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skywalking-ui
  template:
    metadata:
      labels:
        app: skywalking-ui
    spec:
      containers:
        - name: ui
          image: apache/skywalking-ui:10.4.0-java17
          imagePullPolicy: IfNotPresent
          env:
            - name: SW_OAP_ADDRESS
              value: http://skywalking-oap:12800
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
