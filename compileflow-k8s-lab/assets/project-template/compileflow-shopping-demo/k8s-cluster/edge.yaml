apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: compileflow-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-cluster
  ports:
    - name: client
      port: 6379
    - name: cluster-bus
      port: 16379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: compileflow-lab
spec:
  serviceName: redis-cluster
  podManagementPolicy: Parallel
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --appendonly
            - "no"
            - --protected-mode
            - "no"
            - --bind
            - 0.0.0.0
          ports:
            - name: client
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: compileflow-lab
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: redis-cluster-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              for ordinal in 0 1 2 3 4 5; do
                host="redis-cluster-${ordinal}.redis-cluster"
                until redis-cli -h "$host" ping | grep -q PONG; do sleep 2; done
              done
              if redis-cli -h redis-cluster-0.redis-cluster cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
                echo 'Redis Cluster is already initialized.'
                exit 0
              fi
              redis-cli --cluster create \
                redis-cluster-0.redis-cluster:6379 \
                redis-cluster-1.redis-cluster:6379 \
                redis-cluster-2.redis-cluster:6379 \
                redis-cluster-3.redis-cluster:6379 \
                redis-cluster-4.redis-cluster:6379 \
                redis-cluster-5.redis-cluster:6379 \
                --cluster-replicas 1 --cluster-yes
              redis-cli -h redis-cluster-0.redis-cluster cluster info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-entry-config
  namespace: compileflow-lab
data:
  default.conf: |
    upstream gateway_backend {
      server compileflow-cluster-gateway:8080;
    }

    server {
      listen 8080;
      server_name _;

      location = /nginx-health {
        access_log off;
        return 200 "nginx entry is healthy\n";
      }

      location / {
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
          # Nginx 是唯一外部入口，直接覆盖客户端伪造的 X-Forwarded-For。
          proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://gateway_backend;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-entry
  namespace: compileflow-lab
spec:
  type: NodePort
  selector:
    app: nginx-entry
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-entry
  namespace: compileflow-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-entry
  template:
    metadata:
      labels:
        app: nginx-entry
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx-entry-config
