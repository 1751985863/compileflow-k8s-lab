apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: compileflow-lab
spec:
  type: NodePort
  selector:
    app: eureka
  ports:
    - name: http
      port: 8761
      targetPort: 8761
      nodePort: 30761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: compileflow-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: compileflow-eureka-server:cluster
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: EUREKA_HOSTNAME
              value: eureka
            - name: JAVA_TOOL_OPTIONS
              value: -Xms64m -Xmx256m -Dfile.encoding=UTF-8
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 160Mi
              cpu: 50m
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: compileflow-cluster-gateway
  namespace: compileflow-lab
spec:
  selector:
    app: compileflow-cluster-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compileflow-cluster-gateway
  namespace: compileflow-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compileflow-cluster-gateway
  template:
    metadata:
      labels:
        app: compileflow-cluster-gateway
    spec:
      containers:
        - name: gateway
          image: compileflow-cluster-gateway:cluster
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: EUREKA_URL
              value: http://eureka:8761/eureka/
            - name: RATE_LIMIT_REPLENISH_RATE
              value: "200"
            - name: RATE_LIMIT_BURST_CAPACITY
              value: "400"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/skywalking/agent/skywalking-agent.jar -Xms64m -Xmx256m -Dfile.encoding=UTF-8
            - name: SW_AGENT_NAME
              value: compileflow-gateway
            - name: SW_AGENT_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: skywalking-oap:11800
            - name: SW_AGENT_SAMPLE
              value: "-1"
            - name: SW_LOGGING_OUTPUT
              value: CONSOLE
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              memory: 192Mi
              cpu: 50m
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: compileflow-workbench-server
  namespace: compileflow-lab
spec:
  selector:
    app: compileflow-workbench-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compileflow-workbench-server
  namespace: compileflow-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compileflow-workbench-server
  template:
    metadata:
      labels:
        app: compileflow-workbench-server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37.0
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: workbench
          image: compileflow-workbench-server:eureka-2.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --eureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SPRING_APPLICATION_NAME
              value: compileflow-workbench-server
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/compileflow
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lab-database-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-database-secret
                  key: password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka:8761/eureka/
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_INSTANCEID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EUREKA_INSTANCE_IPADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_TOOL_OPTIONS
              # 动态流程编译、JPA 和 SkyWalking Agent 都会使用堆外内存。
              value: -javaagent:/skywalking/agent/skywalking-agent.jar -Xms256m -Xmx768m -Dfile.encoding=UTF-8
            - name: SW_AGENT_NAME
              value: workbench-server
            - name: SW_AGENT_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: skywalking-oap:11800
            - name: SW_AGENT_SAMPLE
              value: "-1"
            - name: SW_LOGGING_OUTPUT
              value: CONSOLE
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1536Mi
