apiVersion: batch/v1
kind: Job
metadata:
  name: k6-shopping-load-test
  namespace: compileflow-lab
  labels:
    app: k6-shopping-load-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-shopping-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent
          args: ["run", "-o", "experimental-prometheus-rw", "/scripts/checkout.js"]
          env:
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: p(90),p(95),p(99),avg,min,max
          envFrom:
            - configMapRef:
                name: k6-load-settings
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: script
          configMap:
            name: k6-shopping-script

